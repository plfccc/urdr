<svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- urdr favicon: the two-strand weave, drawn unbroken. A tab renders this around 16px,
       where the over/under gap the in-app mark uses falls below one pixel and reads as a
       smudge. Colour comes from prefers-color-scheme rather than currentColor, since browser
       chrome has no access to the app's theme variables; values match --brand-accent. -->
  <style>
    .s { stroke: #0f172a; }
    @media (prefers-color-scheme: dark) { .s { stroke: #f8fafc; } }
  </style>
  <g class="s" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M2.5 6.5C6 6.5 6 17.5 12 17.5s6-11 9.5-11" />
    <path d="M2.5 17.5C6 17.5 6 6.5 12 6.5s6 11 9.5 11" />
  </g>
</svg>
